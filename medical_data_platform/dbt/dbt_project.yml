name: medinsight
version: "1.0.0"
config-version: 2

profile: medinsight

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  start_date: "2023-01-01"
  end_date: "2024-12-31"

models:
  medinsight:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: analytics
      facts:
        +materialized: table
      dimensions:
        +materialized: table
