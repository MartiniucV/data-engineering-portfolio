version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: medinsight_postgres
    environment:
      POSTGRES_USER: vlad
      POSTGRES_PASSWORD: vlad123
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/ddl/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlad -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medinsight_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medinsight.ro
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
